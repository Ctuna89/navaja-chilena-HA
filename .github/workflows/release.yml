name: Release

# Publica una release de GitHub cuando la versión del manifest no tiene todavía su
# etiqueta. HACS solo ofrece versiones que existan como release.
on:
  push:
    branches: [main]
    paths:
      - custom_components/navaja_chilena/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer versión del manifest
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/navaja_chilena/manifest.json'))['version'])")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Crear release si no existe
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG ya existe; no se hace nada."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Navaja Chilena ${TAG#v}" --generate-notes
          fi
